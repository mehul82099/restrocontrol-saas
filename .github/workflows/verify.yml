name: Verify RestroControl
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: restrocontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:local-ci-only@localhost:5432/restrocontrol_test
      JWT_SECRET: ci-only-key-with-at-least-32-characters-never-use-in-production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run prisma:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
