name: Semgrep
on:
  pull_request:
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@v4
      - name: Scan all source with the requested packs
        env:
          SEMGREP_SEND_METRICS: off
        run: >-
          semgrep scan --error --metrics=off --disable-version-check
          --config p/javascript --config p/typescript --config p/react
          --config p/nextjs --config p/secrets
