name: Weekly DB backup
on:
  schedule:
    # Sunday 21:30 UTC = Monday 03:00 IST
    - cron: '30 21 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: Check BACKUP_DATABASE_URL secret
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::error title=Missing secret::BACKUP_DATABASE_URL repo secret is not set. See docs/BACKUP.md."
            exit 1
          fi
          case "$BACKUP_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=Wrong URL type::BACKUP_DATABASE_URL must be a direct postgres:// connection string (not prisma+postgres:// / Accelerate). See docs/BACKUP.md."
              exit 1 ;;
          esac

      - name: Install pg_dump 17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database
        id: dump
        run: |
          set -euo pipefail
          FILE="restrocontrol-$(date -u +%F).dump"
          # Custom format is already compressed (zlib, level 9); no extra gzip needed.
          /usr/lib/postgresql/17/bin/pg_dump \
            --format=custom --compress=9 --no-owner --no-privileges \
            --file="$FILE" "$BACKUP_DATABASE_URL"
          # Sanity check: the archive must be readable and non-trivial.
          /usr/lib/postgresql/17/bin/pg_restore --list "$FILE" > toc.txt
          TABLES=$(grep -c ' TABLE DATA ' toc.txt || true)
          SIZE=$(stat -c %s "$FILE")
          echo "Backup $FILE: $SIZE bytes, $TABLES tables with data"
          if [ "$SIZE" -lt 1024 ] || [ "$TABLES" -eq 0 ]; then
            echo "::error title=Suspicious backup::Dump looks empty ($SIZE bytes, $TABLES tables)."
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          {
            echo "### DB backup"
            echo "- File: \`$FILE\`"
            echo "- Size: $SIZE bytes"
            echo "- Tables with data: $TABLES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
